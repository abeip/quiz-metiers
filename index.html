<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Quiz Métiers ABEIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: une colonne centrée type "fiche", l'écran change (accueil → question → résultat) sans recharger */
:root{
  --bg:#f3f7f5; --surface:#ffffff; --ink:#18302a; --muted:#566b64; --line:#d5e2dd;
  --jade:#2f9a7a; --jade-deep:#1f6b55; --jade-soft:#e2f2ec; --eye:#e3b90f; --track:#e6eeeb; --on-jade:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16241f; --ink:#e4efeb; --muted:#9db3ab; --line:#2a3d36;
  --jade:#4cc39d; --jade-deep:#8fe0c4; --jade-soft:#1d3a31; --eye:#f0cb3a; --track:#233630; --on-jade:#0b1a15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16241f; --ink:#e4efeb; --muted:#9db3ab; --line:#2a3d36;
  --jade:#4cc39d; --jade-deep:#8fe0c4; --jade-soft:#1d3a31; --eye:#f0cb3a; --track:#233630; --on-jade:#0b1a15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--line)}
.top b{font-family:var(--display);font-size:15px;letter-spacing:.04em;display:block}
.top span{color:var(--muted);font-size:13px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(30px,6.5vw,46px);font-weight:800}
h1 em{font-style:normal;color:var(--jade)}
h2{font-size:clamp(22px,4.6vw,30px);font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--jade-soft);color:var(--jade-deep);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.btn{background:var(--jade);color:var(--on-jade);border:0;border-radius:12px;padding:14px 22px;font-weight:600;font-size:17px;align-self:flex-start}
.btn:hover{filter:brightness(1.07)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:500}
.ghost:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--eye);outline-offset:2px}
/* progression */
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .3s}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--jade)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--track);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.opt.sel .k{background:var(--jade);color:var(--surface)}
.nav{display:flex;justify-content:space-between;gap:10px}
/* résultat */
.hero{border-radius:18px;padding:26px 24px;background:var(--jade-soft);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero .pct{font-family:var(--display);font-weight:800;font-size:15px;color:var(--jade-deep);letter-spacing:.04em}
.hero .tag{font-size:18px;color:var(--jade-deep);font-weight:500}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:14px solid var(--jade);opacity:.14}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.cols>div{min-width:0;display:flex;flex-direction:column;gap:8px}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
@media (max-width:480px){.row{grid-template-columns:minmax(0,120px) 1fr 40px;font-size:13px}}
.row .bar{height:10px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.top1 span:first-child{font-weight:600}
.row:not(.top1) .bar i{background:var(--muted);opacity:.55}
.second{border-left:4px solid var(--eye);padding-left:14px;display:flex;flex-direction:column;gap:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:13px;text-align:center}
.links{display:flex;flex-direction:column;gap:8px}
.lk{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.lk a{display:inline-flex;align-items:baseline;gap:8px;color:var(--jade-deep);font-weight:500;text-decoration:none;border-bottom:1px solid transparent}
.lk a:hover{border-bottom-color:currentColor}
.src{flex:none;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--jade-soft);color:var(--jade-deep);border-radius:6px;padding:2px 6px}
.more{color:var(--muted);font-size:14px}
.second{gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.screen{animation:in .25s ease-out}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
</style>

/* ====================== moteur du quiz (pas besoin d'y toucher) ====================== */
const KEYS = Object.keys(DOMAINS);
const MAX = Object.fromEntries(KEYS.map(k => [k, QUESTIONS.reduce((s, qu) => s + Math.max(0, ...qu.a.map(o => o[1][k] || 0)), 0)]));
/* Dénominateur plancher : un domaine couvert par peu de questions ne doit pas monter trop facilement à 100 %. */
const FLOOR = 14;
const DEN = Object.fromEntries(KEYS.map(k => [k, Math.max(MAX[k], FLOOR)]));
const app = document.getElementById("app");
let answers = [], idx = 0, orders = [], sent = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function intro(){
  app.innerHTML = `<section class="screen card">
    <h1>Quel métier de l'industrie pharma <em>est fait pour toi&nbsp;?</em></h1>
    <p class="lead">Réponds à ${QUESTIONS.length} questions sur tes goûts, ta façon de travailler et ce qui te motive. On te dit vers quel domaine de l'industrie tu pourrais te diriger, et quels métiers y chercher.</p>
    <div class="meta"><span><strong>${QUESTIONS.length}</strong> questions</span><span><strong>~4</strong> minutes</span><span><strong>${KEYS.length}</strong> domaines</span></div>
    <div class="chips">${KEYS.map(k => `<span class="chip">${esc(DOMAINS[k].name)}</span>`).join("")}</div>
    <button class="btn" id="go">Commencer le quiz</button>
  </section>`;
  document.getElementById("go").onclick = () => { answers = []; idx = 0; orders = QUESTIONS.map(qu => shuffle(qu.a.length)); sent = false; question(); };
}

function question(){
  const qu = QUESTIONS[idx], sel = answers[idx];
  app.innerHTML = `<section class="screen card">
    <div class="prog"><span>Question ${idx+1} / ${QUESTIONS.length}</span><div class="bar"><i style="width:${(idx/QUESTIONS.length)*100}%"></i></div></div>
    ${qu.t ? `<h3>${esc(qu.t)}</h3>` : ""}
    <h2>${esc(qu.q)}</h2>
    <div class="opts">${orders[idx].map((oi, n) => `<button class="opt${sel===oi?" sel":""}" data-i="${oi}"><span class="k">${"ABCDEFGHIJ"[n]}</span><span>${esc(qu.a[oi][0])}</span></button>`).join("")}</div>
    <div class="nav"><button class="ghost" id="back" ${idx===0?"disabled":""}>← Précédente</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[idx] = +b.dataset.i;
    b.classList.add("sel");
    setTimeout(() => { idx++; idx < QUESTIONS.length ? question() : result(); }, 180);
  });
  document.getElementById("back").onclick = () => { if (idx > 0) { idx--; question(); } };
  app.querySelector(".opt")?.focus({preventScroll:true});
}

function score(){
  const raw = Object.fromEntries(KEYS.map(k => [k, 0]));
  answers.forEach((oi, qi) => { const o = QUESTIONS[qi].a[oi]; for (const k in o[1]) raw[k] += o[1][k]; });
  return KEYS.map(k => ({k, pct: DEN[k] ? Math.round(100 * raw[k] / DEN[k]) : 0, raw: raw[k]}))
             .sort((a, b) => b.pct - a.pct || b.raw - a.raw);
}

function result(){
  const s = score(), d = DOMAINS[s[0].k], d2 = DOMAINS[s[1].k];
  const hybrid = s[0].pct - s[1].pct <= 8;
  if (!sent) { sent = true; sendStats(s[0].k, s[1].k); }
  app.innerHTML = `<section class="screen" style="display:flex;flex-direction:column;gap:18px">
    <div class="hero">
      <span class="pct">TON DOMAINE · ${s[0].pct}&nbsp;% DE CORRESPONDANCE</span>
      <h1>${esc(d.name)}</h1>
      <p class="tag">${esc(d.tag)}</p>
    </div>
    <div class="card">
      <p>${esc(d.desc)}</p>
      <div class="cols">
        <div><h3>Au quotidien</h3><ul>${d.day.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div><h3>Métiers à explorer</h3><ul>${d.jobs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><h3>Pour y aller</h3><p>${esc(d.path)}</p></div>
      ${links(d)}
    </div>
    <div class="card">
      <div class="second">
        <h3>${hybrid ? "Profil hybride : ton deuxième domaine est très proche" : "Ton deuxième domaine"}</h3>
        <p><strong>${esc(d2.name)}</strong> (${s[1].pct}&nbsp;%) · ${esc(d2.tag)}</p>
        <p class="more">Métiers : ${esc(d2.jobs.slice(0, 3).join(" · "))}</p>
        ${links(d2, true)}
      </div>
      <h3>Ton profil complet</h3>
      <div class="rows">${s.map((r, i) => `<div class="row${i===0?" top1":""}"><span>${esc(DOMAINS[r.k].name)}</span><div class="bar"><i style="width:${r.pct}%"></i></div><span class="v">${r.pct}&nbsp;%</span></div>`).join("")}</div>
    </div>
    <div class="actions">
      <button class="btn" id="again">Refaire le quiz</button>
      <button class="ghost" id="review">Revoir mes réponses</button>
    </div>
  </section>`;
  document.getElementById("again").onclick = intro;
  document.getElementById("review").onclick = () => { idx = 0; question(); };
  window.scrollTo({top:0, behavior:"smooth"});
}

function links(d, compact){
  if (!d.links || !d.links.length) return "";
  const list = compact ? d.links.slice(0, 2) : d.links;
  return `<div class="links">${compact ? "" : "<h3>Fiches métiers officielles</h3>"}
    <ul class="lk">${list.map(([label, url, src]) => `<li><a href="${esc(url)}" target="_blank" rel="noopener"><span class="src">${esc(src)}</span>${esc(label)}<span aria-hidden="true"> ↗</span></a></li>`).join("")}</ul></div>`;
}

function sendStats(k1, k2){
  if (!STATS.formUrl || !STATS.entryDomain) return;
  try {
    const body = new URLSearchParams();
    body.append(STATS.entryDomain, DOMAINS[k1].name);
    if (STATS.entrySecond) body.append(STATS.entrySecond, DOMAINS[k2].name);
    fetch(STATS.formUrl, {method:"POST", mode:"no-cors", body}).catch(() => {});
  } catch (e) {}
}

intro();
</script>
